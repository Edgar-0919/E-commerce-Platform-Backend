server:
  port: 8103

spring:
  application:
    name: order-service
  config:
    import: nacos:${spring.application.name}.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
        shared-configs:
          - data-id: common-config.yaml
            group: DEFAULT_GROUP
            refresh: true
    sentinel:
      transport:
        dashboard: localhost:8720
        port: 8722
      eager: true
    stream:
      default-binder: rabbit
      function:
        definition: refundSuccess
      bindings:
        refundSuccess-in-0:
          destination: refund-success
          group: ${spring.application.name}
          content-type: application/json
        orderCreated-out-0:
          destination: order-created
          content-type: application/json
      rabbit:
        bindings:
          refundSuccess-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ecommerce.order.model.entity

knife4j:
  enable: true

logging:
  level:
    com.ecommerce: debug

# Seata 分布式事务配置 — AT 模式
seata:
  registry:
    type: nacos
    nacos:
      server-addr: localhost:8848
      group: SEATA_GROUP
  config:
    type: nacos
    nacos:
      server-addr: localhost:8848
      group: SEATA_GROUP
  tx-service-group: ecommerce-tx-group
  service:
    vgroup-mapping:
      ecommerce-tx-group: default
  data-source-proxy-mode: AT

# Micrometer Tracing — 链路追踪上报到 Zipkin
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
