server:
  port: 8103

spring:
  application:
    name: order-service
  config:
    import: nacos:order-service.yaml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
        shared-configs:
          - data-id: common-config.yaml
            group: DEFAULT_GROUP
            refresh: true
    stream:
      function:
        definition: orderTimeout;paymentSuccess
      bindings:
        # 延迟发送 binding：发送带 TTL 的消息到 order-timeout-delay 延迟交换机（Producer 侧 sendDelay 用）
        orderTimeoutDelay-out-0:
          destination: order-timeout-delay
          content-type: application/json
        # 业务消费 binding：TTL到期后经 DLX 转发到 order-timeout 业务交换机 → OrderTimeoutConsumer 消费
        orderTimeout-in-0:
          destination: order-timeout
          group: ${spring.application.name}-group
          consumer:
            max-attempts: 3
        # 支付成功输出 binding：通知 product-service 扣减库存（跨服务 MQ）
        paymentSuccess-out-0:
          destination: payment-success
          content-type: application/json
        # 退款成功输出 binding：通知 product-service 恢复库存（跨服务 MQ）
        refundSuccess-out-0:
          destination: refund-success
          content-type: application/json
        # 优惠券核销输出 binding：通知 marketing-service 核销优惠券（跨服务 MQ）
        couponUse-out-0:
          destination: coupon-use
          content-type: application/json
      rabbit:
        bindings:
          orderTimeout-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true
              declare-exchange: true