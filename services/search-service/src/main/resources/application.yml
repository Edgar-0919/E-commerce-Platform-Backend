server:
  port: 8107

spring:
  application:
    name: search-service
  config:
    import: nacos:${spring.application.name}.yaml
  elasticsearch:
    uris: http://localhost:9200
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
        shared-configs:
          - data-id: common-config.yaml
            group: DEFAULT_GROUP
            refresh: true
    sentinel:
      transport:
        dashboard: localhost:8720
        port: 8726
      eager: true
    stream:
      default-binder: rabbit
      function:
        definition: productChange
      bindings:
        productChange-in-0:
          destination: product-change
          group: ${spring.application.name}
          content-type: application/json
      rabbit:
        bindings:
          productChange-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true

knife4j:
  enable: true

logging:
  level:
    com.ecommerce: debug
    org.springframework.data.elasticsearch: debug

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
