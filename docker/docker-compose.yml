# ============================================
# 小羊电商平台 - Docker Compose 基础设施配置
# ============================================
# 此文件定义了电商平台运行所需的所有基础设施服务：
# - MySQL: 关系型数据库（商品、订单、用户等核心数据）
# - Redis: 缓存服务（热点数据、库存锁定、购物车）
# - Nacos: 服务注册与配置中心
# - RabbitMQ: 消息队列（Spring Cloud Stream 绑定，异步解耦、最终一致性）
# ============================================

version: '3.8'

services:
  # ==================== MySQL 数据库 ====================
  # 端口: 3306
  # 用途: 存储用户、商品、订单、库存等结构化数据
  # 特性: 
  #   - 使用 utf8mb4 字符集支持中文和 emoji
  #   - 自动执行 ../sql 目录下的初始化脚本
  #   - 脚本按文件名排序执行：01-建表 -> 99-测试数据
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123    # 数据库密码
      TZ: Asia/Shanghai               # 时区设置
    ports:
      - "3306:3306"                   # 端口映射
    volumes:
      - mysql_data:/var/lib/mysql                 # 数据持久化卷
      - ../sql:/docker-entrypoint-initdb.d        # 初始化SQL脚本目录
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped           # 容器退出时自动重启（除非手动停止）

  # ==================== Redis 缓存 ====================
  # 端口: 6379
  # 用途: 
  #   - 热点数据缓存（商品信息、用户信息）
  #   - 库存锁定（Lua脚本原子操作防超卖）
  #   - 购物车数据存储
  #   - 秒杀场景限流
  redis:
    image: redis:7.2-alpine           # 使用轻量级alpine镜像
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data              # 数据持久化卷
    restart: unless-stopped

  # ==================== Nacos 服务注册中心 ====================
  # 端口: 8848（主端口）, 9848（健康检查端口）
  # http://localhost:8848/nacos/index.html
  # 用途:
  #   - 服务注册与发现（微服务架构核心组件）
  #   - 配置管理（统一管理各服务配置）
  #   - 健康检查与服务实例管理
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ecommerce-nacos
    environment:
      MODE: standalone                # 单机模式（生产环境使用集群模式）
      PREFER_HOST_MODE: hostname      # 使用主机名模式
    ports:
      - "8848:8848"                   # Nacos主端口
      - "9848:9848"                   # Nacos健康检查端口
    volumes:
      - nacos_data:/home/nacos/data   # 配置和数据持久化
    restart: unless-stopped

  # ==================== RabbitMQ 消息队列 ====================
  # 端口: 5672 (AMQP), 15672 (Management UI)
  # 用途:
  #   - Spring Cloud Stream 消息驱动（异步解耦、最终一致性）
  #   - 事件: payment-success, order-created, product-status-change, refund-success
  #   - Management UI: http://localhost:15672 (guest/guest)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecommerce-rabbitmq
    # 延迟消息实现方式：原生 TTL + DLX（死信交换机），不依赖任何 RabbitMQ 插件。
    # 镜像原生支持 management 插件；delayed_message_exchange 插件未内置在 alpine 版中且启用流程不稳定，
    # 故改为：发送端给消息设 expiration(=TTL) → 发到 delay exchange → 进入 delay 队列（无消费者）
    #        → TTL 到期后自动通过 DLX 路由到真正的业务 exchange：order-timeout / payment-success 等
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"                   # AMQP 协议端口
      - "15672:15672"                 # Management UI 端口
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

# ==================== 数据持久化卷 ====================
# 所有服务的数据都通过Docker Volume持久化，避免容器删除后数据丢失
volumes:
  mysql_data:           # MySQL数据库数据
  redis_data:           # Redis缓存数据
  nacos_data:           # Nacos配置和注册数据
  rabbitmq_data:        # RabbitMQ消息队列数据
