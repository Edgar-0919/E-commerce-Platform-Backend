# ============================================
# 小羊电商平台 - Docker Compose 基础设施配置
# ============================================
# 此文件定义了电商平台运行所需的所有基础设施服务：
# - MySQL: 关系型数据库（商品、订单、用户等核心数据）
# - Redis: 缓存服务（热点数据、库存锁定、购物车）
# - Nacos: 服务注册与配置中心
# - Elasticsearch: 全文搜索引擎（商品搜索）
# - RabbitMQ: 消息队列（Spring Cloud Stream 绑定，异步解耦、最终一致性）
# - Sentinel Dashboard: 流量监控与熔断降级控制台
# ============================================

version: '3.8'

services:
  # ==================== MySQL 数据库 ====================
  # 端口: 3306
  # 用途: 存储用户、商品、订单、库存等结构化数据
  # 特性: 
  #   - 使用 utf8mb4 字符集支持中文和 emoji
  #   - 自动执行 ../sql 目录下的初始化脚本
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123    # 数据库密码
      TZ: Asia/Shanghai               # 时区设置
    ports:
      - "3306:3306"                   # 端口映射
    volumes:
      - mysql_data:/var/lib/mysql                 # 数据持久化卷
      - ../sql:/docker-entrypoint-initdb.d        # 初始化SQL脚本目录
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped           # 容器退出时自动重启（除非手动停止）

  # ==================== Redis 缓存 ====================
  # 端口: 6379
  # 用途: 
  #   - 热点数据缓存（商品信息、用户信息）
  #   - 库存锁定（Lua脚本原子操作防超卖）
  #   - 购物车数据存储
  #   - 秒杀场景限流
  redis:
    image: redis:7.2-alpine           # 使用轻量级alpine镜像
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data              # 数据持久化卷
    restart: unless-stopped

  # ==================== Nacos 服务注册中心 ====================
  # 端口: 8848（主端口）, 9848（健康检查端口）
  # http://localhost:8848/nacos/index.html
  # 用途:
  #   - 服务注册与发现（微服务架构核心组件）
  #   - 配置管理（统一管理各服务配置）
  #   - 健康检查与服务实例管理
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ecommerce-nacos
    environment:
      MODE: standalone                # 单机模式（生产环境使用集群模式）
      PREFER_HOST_MODE: hostname      # 使用主机名模式
    ports:
      - "8848:8848"                   # Nacos主端口
      - "9848:9848"                   # Nacos健康检查端口
    volumes:
      - nacos_data:/home/nacos/data   # 配置和数据持久化
    restart: unless-stopped

  # ==================== Elasticsearch 搜索引擎 ====================
  # 端口: 9200（REST API）, 9300（内部通信）
  # 用途:
  #   - 商品全文搜索
  #   - 搜索关键词高亮
  #   - 聚合分析（分类统计、价格区间等）
  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.es
    container_name: ecommerce-es
    environment:
      discovery.type: single-node      # 单节点模式（生产环境使用集群）
      ES_JAVA_OPTS: -Xms512m -Xmx512m # JVM堆内存设置
      xpack.security.enabled: false   # 禁用安全验证（开发环境）
    ports:
      - "9200:9200"                   # REST API端口
      - "9300:9300"                   # 节点间通信端口
    volumes:
      - es_data:/usr/share/elasticsearch/data  # 索引数据持久化
    restart: unless-stopped

  # ==================== RabbitMQ 消息队列 ====================
  # 端口: 5672 (AMQP), 15672 (Management UI)
  # 用途:
  #   - Spring Cloud Stream 消息驱动（异步解耦、最终一致性）
  #   - 事件: payment-success, order-created, product-status-change, refund-success
  #   - Management UI: http://localhost:15672 (guest/guest)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecommerce-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"                   # AMQP 协议端口
      - "15672:15672"                 # Management UI 端口
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  # ==================== Sentinel Dashboard 控制台 ====================
  # 端口: 8730
  # 用途:
  #   - 实时流量监控（QPS、响应时间、线程数）
  #   - 熔断降级规则可视化配置
  #   - 热点参数限流管理
  # 访问: http://localhost:8730 (sentinel/sentinel)
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: ecommerce-sentinel
    environment:
      SERVER_PORT: 8080
      SENTINEL_DASHBOARD_USERNAME: sentinel
      SENTINEL_DASHBOARD_PASSWORD: sentinel
    ports:
      - "8730:8080"                   # Dashboard 访问端口
    restart: unless-stopped

  # ==================== Seata 分布式事务协调器 ====================
  # 端口: 7091 (控制台), 8091 (RPC通信)
  # 用途:
  #   - 协调分布式事务的提交与回滚（AT 模式）
  #   - 适用场景：订单创建（同时操作订单、库存、优惠券）
  #   - 控制台: http://localhost:7091
  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: ecommerce-seata
    environment:
      # Seata Server RPC 通信端口
      SEATA_PORT: 8091
      # 存储模式：开发环境使用 file 模式，无需额外数据库
      STORE_MODE: file
      # 注册到 Nacos，以便微服务客户端通过 Nacos 发现 Seata Server
      SEATA_REGISTRY_TYPE: nacos
      SEATA_REGISTRY_NACOS_SERVER_ADDR: nacos:8848
      SEATA_REGISTRY_NACOS_GROUP: SEATA_GROUP
      SEATA_REGISTRY_NACOS_CLUSTER: default
      SEATA_REGISTRY_NACOS_APPLICATION: seata-server
      # Seata Server 自身配置也从 Nacos 读取
      SEATA_CONFIG_TYPE: nacos
      SEATA_CONFIG_NACOS_SERVER_ADDR: nacos:8848
      SEATA_CONFIG_NACOS_GROUP: SEATA_GROUP
      # Seata Server 对外暴露的 IP，微服务通过此 IP 连接
      SEATA_IP: host.docker.internal
    ports:
      - "7091:7091"
      - "8091:8091"
    restart: unless-stopped

  # ==================== Zipkin 分布式链路追踪 ====================
  # 端口: 9411
  # 用途:
  #   - 收集各微服务的调用链路数据（trace/span）
  #   - 可视化服务依赖拓扑和性能瓶颈
  #   - 与 Micrometer Tracing + Brave 集成
  #   - 控制台: http://localhost:9411
  zipkin:
    image: openzipkin/zipkin:3
    container_name: ecommerce-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped

# ==================== 数据持久化卷 ====================
# 所有服务的数据都通过Docker Volume持久化，避免容器删除后数据丢失
volumes:
  mysql_data:           # MySQL数据库数据
  redis_data:           # Redis缓存数据
  nacos_data:           # Nacos配置和注册数据
  es_data:              # Elasticsearch索引数据
  rabbitmq_data:        # RabbitMQ消息队列数据
